name: Verify and publish self-hosted images
on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-selfhosted-images
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/goliajp/sentori/sentori-server
jobs:
  product:
    if: github.repository == 'goliajp/sentori-selfhosted'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - name: Test the exported product
        run: |
          bun install --frozen-lockfile
          bun run build:sdks
          bun run test:sdks
          node sdk/cli/tools/check-install.mjs
          cd webapp
          bun install --frozen-lockfile
          bun run check
          bun run build
          cd ../core
          cargo test --locked --workspace
          cd ../self-hosted/server
          cargo test --locked
          cd ../cli
          cargo test --locked
          cd ../snapshot
          cargo test --locked
  build:
    if: github.repository == 'goliajp/sentori-selfhosted'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build a native candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: self-hosted/docker/Dockerfile
          load: true
          tags: sentori-candidate:${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/goliajp/sentori-selfhosted
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Test this exact candidate image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' "sentori-candidate:$ARCH")"
          python3 self-hosted/tests/image_smoke.py --image "$image_id" --expected-version "$(cat VERSION)" --output "acceptance-$ARCH.json"
          echo "CANDIDATE_ID=$image_id" >> "$GITHUB_ENV"
      - name: Publish the verified architecture by digest
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:candidate-$GITHUB_SHA-$ARCH"
          docker tag "$CANDIDATE_ID" "$tag"
          docker push "$tag"
          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '\"')"
          mkdir digests
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ matrix.arch }}
          path: acceptance-${{ matrix.arch }}.json
          if-no-files-found: error
  publish:
    needs: [product, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Publish verified manifest; preserve immutable versions
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          sources=()
          for path in digests/*; do sources+=("$IMAGE@sha256:$(basename "$path")"); done
          test "${#sources[@]}" = 2
          docker buildx imagetools create --tag "$IMAGE:sha-$GITHUB_SHA" "${sources[@]}"
          if [[ "$SOURCE_REF" == refs/tags/* ]]; then
            version="$(cat VERSION)"
            test "$SOURCE_TAG" = "v$version"
            if docker buildx imagetools inspect "$IMAGE:$version" > /dev/null 2>&1; then
              echo 'Refusing to overwrite an existing version. Publish a new release.' >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$IMAGE:$version" --tag "$IMAGE:latest" "$IMAGE:sha-$GITHUB_SHA"
          fi
