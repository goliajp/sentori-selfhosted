plugins {
    id 'com.android.application' version '8.12.0'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

android {
    namespace 'com.example.consumer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.consumer'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    kotlinOptions { jvmTarget = '17' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The published coordinates, exactly as an integrator writes them.
    // The version comes from the same file the SDK's own build reads,
    // so this cannot drift into testing an artifact nobody ships.
    implementation "jp.golia.sentori:sentori:${file('../../../sdk/native/VERSION').text.trim()}"
}
